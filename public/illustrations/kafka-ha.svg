<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="400" fill="#07070d"/>
  <circle cx="600" cy="200" r="240" fill="#3b82f6" opacity="0.06"/>

  <text x="60" y="44" fill="#ffffff" fill-opacity="0.55" font-size="18" font-weight="600">High availability</text>
  <text x="60" y="66" fill="#ffffff" fill-opacity="0.3" font-size="13">Partitions replicated across brokers, automatic leader election</text>

  <!-- producer -->
  <rect x="70" y="170" width="140" height="60" rx="14" fill="#1e1b3a" stroke="#a78bfa" stroke-opacity="0.35"/>
  <text x="140" y="200" fill="#ffffff" fill-opacity="0.85" font-size="14" text-anchor="middle">Producer</text>
  <text x="140" y="218" fill="#c4b5fd" fill-opacity="0.7" font-size="11" text-anchor="middle">writes</text>

  <!-- consumer -->
  <rect x="990" y="170" width="140" height="60" rx="14" fill="#06281e" stroke="#34d399" stroke-opacity="0.35"/>
  <text x="1060" y="200" fill="#ffffff" fill-opacity="0.85" font-size="14" text-anchor="middle">Consumer</text>
  <text x="1060" y="218" fill="#6ee7b7" fill-opacity="0.7" font-size="11" text-anchor="middle">reads</text>

  <!-- broker 1 (leader) -->
  <rect x="450" y="70" width="300" height="66" rx="14" fill="#1e3a5f" stroke="#60a5fa" stroke-opacity="0.55"/>
  <text x="600" y="100" fill="#ffffff" fill-opacity="0.92" font-size="15" text-anchor="middle" font-weight="600">Broker 1 (node 1)</text>
  <text x="600" y="120" fill="#93c5fd" fill-opacity="0.85" font-size="12" text-anchor="middle">partition leader: reads + writes</text>

  <!-- broker 2 -->
  <rect x="450" y="168" width="300" height="64" rx="14" fill="#15213a" stroke="#60a5fa" stroke-opacity="0.32"/>
  <text x="600" y="196" fill="#ffffff" fill-opacity="0.85" font-size="15" text-anchor="middle">Broker 2 (node 2)</text>
  <text x="600" y="216" fill="#93c5fd" fill-opacity="0.7" font-size="12" text-anchor="middle">in-sync replica</text>

  <!-- broker 3 -->
  <rect x="450" y="264" width="300" height="64" rx="14" fill="#15213a" stroke="#60a5fa" stroke-opacity="0.32"/>
  <text x="600" y="292" fill="#ffffff" fill-opacity="0.85" font-size="15" text-anchor="middle">Broker 3 (node 3)</text>
  <text x="600" y="312" fill="#93c5fd" fill-opacity="0.7" font-size="12" text-anchor="middle">in-sync replica</text>

  <!-- producer -> leader -->
  <line x1="210" y1="190" x2="450" y2="110" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M450 110 l-11 -1 4 -9 z" fill="#a78bfa" fill-opacity="0.7"/>

  <!-- leader -> consumer -->
  <line x1="750" y1="110" x2="990" y2="190" stroke="#34d399" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M990 190 l-11 1 4 9 z" fill="#34d399" fill-opacity="0.7"/>

  <!-- replication leader -> replicas -->
  <line x1="500" y1="136" x2="500" y2="168" stroke="#34d399" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M500 168 l-4 -10 8 0 z" fill="#34d399" fill-opacity="0.7"/>
  <line x1="700" y1="136" x2="700" y2="264" stroke="#34d399" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M700 264 l-4 -10 8 0 z" fill="#34d399" fill-opacity="0.7"/>
  <text x="772" y="200" fill="#34d399" fill-opacity="0.7" font-size="11" transform="rotate(90 772 200)" text-anchor="middle">replication, RF 3, min ISR 2</text>

  <text x="600" y="380" fill="#ffffff" fill-opacity="0.35" font-size="13" text-anchor="middle">If the leader broker fails, an in-sync replica is promoted to leader automatically, with no data loss.</text>
</svg>
