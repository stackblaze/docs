<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="400" fill="var(--diagram-canvas, #07070d)"/>
  <circle cx="180" cy="90" r="150" fill="var(--diagram-violet, #8b5cf6)" opacity="0.09"/>
  <circle cx="1040" cy="310" r="170" fill="var(--diagram-blue, #3b82f6)" opacity="0.07"/>

  <text x="70" y="48" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.55" font-size="20" font-weight="600">WebSocket + Redis pub/sub</text>
  <text x="70" y="72" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="13">A socket stays on one replica · each replica fans out to its local clients</text>

  <rect x="70" y="110" width="160" height="56" rx="12" fill="var(--diagram-violet-fill, #312e81)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.4"/>
  <text x="150" y="136" fill="var(--diagram-violet-4, #e9d5ff)" font-size="14" font-weight="600" text-anchor="middle">Client A</text>
  <text x="150" y="154" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">pinned WS</text>

  <rect x="70" y="180" width="160" height="56" rx="12" fill="var(--diagram-violet-fill, #312e81)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.4"/>
  <text x="150" y="206" fill="var(--diagram-violet-4, #e9d5ff)" font-size="14" font-weight="600" text-anchor="middle">Client B</text>
  <text x="150" y="224" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">pinned WS</text>

  <rect x="70" y="250" width="160" height="56" rx="12" fill="var(--diagram-violet-fill-2, #1e1b3a)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.3"/>
  <text x="150" y="276" fill="var(--diagram-violet-3, #c4b5fd)" font-size="14" font-weight="600" text-anchor="middle">Client C</text>
  <text x="150" y="294" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">pinned WS</text>

  <path d="M230 138 H310" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="310,138 298,132 298,144" fill="var(--diagram-violet-2, #a78bfa)" fill-opacity="0.7"/>
  <path d="M230 208 H310" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="310,208 298,202 298,214" fill="var(--diagram-violet-2, #a78bfa)" fill-opacity="0.7"/>
  <path d="M230 278 H310 V250" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.45" stroke-width="2" fill="none"/>
  <polygon points="310,250 304,262 316,262" fill="var(--diagram-blue-2, #60a5fa)" fill-opacity="0.7"/>

  <rect x="320" y="118" width="240" height="108" rx="16" fill="var(--diagram-blue-fill, #1e3a5f)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.45"/>
  <text x="440" y="158" fill="var(--diagram-blue-3, #93c5fd)" font-size="16" font-weight="600" text-anchor="middle">Replica 1</text>
  <text x="440" y="182" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.45" font-size="12" text-anchor="middle">local clients A, B</text>
  <text x="440" y="202" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="12" text-anchor="middle">socket stays here</text>

  <rect x="320" y="248" width="240" height="80" rx="16" fill="var(--diagram-blue-fill-2, #15213a)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.35"/>
  <text x="440" y="280" fill="var(--diagram-blue-3, #93c5fd)" font-size="16" font-weight="600" text-anchor="middle">Replica 2</text>
  <text x="440" y="304" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-size="12" text-anchor="middle">local client C · fans out</text>

  <path d="M560 172 H660" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.55" stroke-width="2"/>
  <polygon points="660,172 648,166 648,178" fill="var(--diagram-green, #34d399)" fill-opacity="0.7"/>
  <text x="610" y="160" fill="var(--diagram-green, #34d399)" fill-opacity="0.7" font-size="11" text-anchor="middle">publish</text>

  <path d="M660 248 H560" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="560,248 572,242 572,254" fill="var(--diagram-green, #34d399)" fill-opacity="0.65"/>
  <text x="610" y="270" fill="var(--diagram-green, #34d399)" fill-opacity="0.65" font-size="11" text-anchor="middle">subscribe</text>

  <rect x="670" y="150" width="260" height="120" rx="16" fill="var(--diagram-green-fill, #064e3b)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4"/>
  <text x="800" y="198" fill="var(--diagram-green-2, #6ee7b7)" font-size="16" font-weight="600" text-anchor="middle">Redis</text>
  <text x="800" y="222" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.45" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">pub/sub channel</text>
  <text x="800" y="244" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="12" text-anchor="middle">every replica hears the event</text>

  <rect x="960" y="166" width="170" height="88" rx="14" fill="var(--diagram-neutral-fill, #1c1917)" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.08"/>
  <text x="1045" y="202" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.55" font-size="13" text-anchor="middle">New sockets</text>
  <text x="1045" y="224" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">round-robin</text>
  <text x="1045" y="242" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">across replicas</text>

  <text x="70" y="372" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="13">io.emit and room broadcast work only after Redis pub/sub is wired</text>
</svg>
