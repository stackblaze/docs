<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <rect width="1200" height="400" fill="#07070d"/>
  <text x="80" y="55" fill="#ffffff" fill-opacity="0.5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Point-in-time recovery</text>
  <rect x="80" y="120" width="200" height="80" rx="12" fill="#064e3b" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="110" y="158" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="15">Base backup</text>
  <text x="110" y="182" fill="#ffffff" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="12">daily snapshot</text>
  <rect x="300" y="120" width="720" height="80" rx="12" fill="#1e3a5f" stroke="#38bdf8" stroke-opacity="0.35"/>
