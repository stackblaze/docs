<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="400" fill="var(--diagram-canvas, #07070d)"/>
  <circle cx="180" cy="90" r="150" fill="var(--diagram-violet, #8b5cf6)" opacity="0.1"/>
  <circle cx="1040" cy="300" r="170" fill="var(--diagram-blue, #3b82f6)" opacity="0.08"/>

  <text x="70" y="48" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.55" font-size="20" font-weight="600">Secret file mount</text>
  <text x="70" y="72" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="13">Encrypted credential as a read-only file, not an environment variable</text>

  <rect x="70" y="130" width="240" height="120" rx="16" fill="var(--diagram-violet-fill, #312e81)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.4"/>
  <text x="190" y="172" fill="var(--diagram-violet-4, #e9d5ff)" font-size="15" font-weight="600" text-anchor="middle">Dashboard</text>
  <text x="190" y="196" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.45" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">gcp-service-account.json</text>
  <text x="190" y="218" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="12" text-anchor="middle">AES-256 · hidden after save</text>

  <path d="M310 190 H380" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.2" stroke-width="2"/>
  <polygon points="380,190 368,184 368,196" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3"/>

  <rect x="390" y="118" width="280" height="144" rx="16" fill="var(--diagram-blue-fill-3, #101827)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.4"/>
  <text x="530" y="158" fill="var(--diagram-blue-3, #93c5fd)" font-size="15" font-weight="600" text-anchor="middle">Encrypted store</text>
  <text x="530" y="184" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-size="12" text-anchor="middle">contents never shown again</text>
  <text x="530" y="206" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">name + mount path stay visible</text>
  <text x="530" y="230" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="12" text-anchor="middle">not in git or the image</text>

  <path d="M670 190 H740" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="740,190 728,184 728,196" fill="var(--diagram-green, #34d399)" fill-opacity="0.7"/>

  <rect x="750" y="118" width="380" height="144" rx="16" fill="var(--diagram-green-fill, #064e3b)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4"/>
  <text x="940" y="158" fill="var(--diagram-green-2, #6ee7b7)" font-size="15" font-weight="600" text-anchor="middle">Container</text>
  <text x="940" y="184" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.5" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">/secrets/gcp-sa.json</text>
  <text x="940" y="208" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-size="12" text-anchor="middle">read-only file at the mount path</text>
  <text x="940" y="230" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="12" text-anchor="middle">directory created if missing</text>

  <rect x="70" y="288" width="500" height="56" rx="14" fill="var(--diagram-pink-fill, #1f1317)" stroke="var(--diagram-red, #fca5a5)" stroke-opacity="0.2"/>
  <text x="320" y="322" fill="var(--diagram-red, #fca5a5)" font-size="13" text-anchor="middle">Not an env var · some credentials must be files</text>

  <rect x="590" y="288" width="540" height="56" rx="14" fill="var(--diagram-green-fill-2, #06281e)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.3"/>
  <text x="860" y="322" fill="var(--diagram-green-2, #6ee7b7)" font-size="13" text-anchor="middle">GOOGLE_APPLICATION_CREDENTIALS can point at the path</text>
</svg>
