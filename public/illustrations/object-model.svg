  <text x="900" y="146" fill="var(--diagram-blue-3, #93c5fd)" font-size="16" font-weight="600" text-anchor="middle">Inside one environment</text>
  <rect x="698" y="168" width="120" height="48" rx="10" fill="var(--diagram-violet-fill, #312e81)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.35"/>
