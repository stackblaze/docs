  <rect x="394" y="212" width="182" height="36" rx="10" fill="var(--diagram-blue-fill, #1e3a5f)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.3"/>
  <text x="485" y="235" fill="var(--diagram-blue-3, #93c5fd)" font-size="13" font-weight="600" text-anchor="middle">Custom</text>
  <rect x="394" y="256" width="182" height="36" rx="10" fill="var(--diagram-green-fill, #064e3b)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.3"/>
  <text x="485" y="279" fill="var(--diagram-green-2, #6ee7b7)" font-size="13" font-weight="600" text-anchor="middle">Preview</text>

