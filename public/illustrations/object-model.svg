  <text x="900" y="274" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">reach each other by service name · postgres:5432</text>

  <text x="600" y="360" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">dashboard: project · environment · service    API: pipeline · phase · app</text>
