  <path d="M950 176 H980" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="70" y="340" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="14">canvas tile next to the service · not a CDN · not anycast</text>
