  <path d="M260 176 H340" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.2" stroke-width="2"/>
  <polygon points="340,176 328,170 328,182" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3"/>

  <rect x="350" y="118" width="280" height="164" rx="16" fill="var(--diagram-blue-fill-3, #101827)" stroke="var(--diagram-amber-2, #fbbf24)" stroke-opacity="0.45"/>
  <text x="490" y="154" fill="var(--diagram-amber, #fde68a)" font-size="16" font-weight="600" text-anchor="middle">App Shield</text>
