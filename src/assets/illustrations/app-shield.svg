  <rect x="500" y="196" width="100" height="40" rx="10" fill="var(--diagram-blue-fill, #1e3a5f)"/>
  <text x="550" y="222" fill="var(--diagram-blue-3, #93c5fd)" font-size="12" text-anchor="middle">Rules</text>
  <text x="490" y="260" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">under-attack mode on spikes</text>

