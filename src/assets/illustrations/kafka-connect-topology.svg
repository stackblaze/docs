<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="440" fill="var(--diagram-canvas, #07070d)"/>

  <circle cx="160" cy="220" r="180" fill="var(--diagram-violet, #8b5cf6)" opacity="0.06"/>
  <circle cx="600" cy="220" r="200" fill="var(--diagram-blue, #3b82f6)" opacity="0.07"/>
  <circle cx="1040" cy="220" r="180" fill="var(--diagram-green, #34d399)" opacity="0.06"/>

  <!-- ===== SOURCE CONNECTORS (left) ===== -->
  <text x="60" y="48" fill="var(--diagram-violet-3, #c4b5fd)" fill-opacity="0.9" font-size="15" font-weight="600">Source connectors</text>
  <text x="60" y="70" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="12">Stream changes in (CDC)</text>

  <rect x="60" y="150" width="190" height="58" rx="13" fill="var(--diagram-violet-fill-2, #1e1b3a)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.4"/>
  <text x="155" y="176" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.88" font-size="14" text-anchor="middle">Postgres CDC</text>
  <text x="155" y="194" fill="var(--diagram-violet-3, #c4b5fd)" fill-opacity="0.75" font-size="11" text-anchor="middle">Debezium</text>

  <rect x="60" y="226" width="190" height="58" rx="13" fill="var(--diagram-violet-fill-2, #1e1b3a)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.4"/>
  <text x="155" y="252" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.88" font-size="14" text-anchor="middle">MySQL / MariaDB CDC</text>
  <text x="155" y="270" fill="var(--diagram-violet-3, #c4b5fd)" fill-opacity="0.75" font-size="11" text-anchor="middle">Debezium</text>

  <!-- arrows source -> kafka -->
  <line x1="250" y1="179" x2="430" y2="205" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="250" y1="255" x2="430" y2="235" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M430 205 l-11 -2 5 9 z" fill="var(--diagram-violet-2, #a78bfa)" fill-opacity="0.7"/>
  <path d="M430 235 l-11 2 5 -9 z" fill="var(--diagram-violet-2, #a78bfa)" fill-opacity="0.7"/>

  <!-- ===== KAFKA (center) ===== -->
  <rect x="432" y="120" width="276" height="200" rx="18" fill="var(--diagram-blue-fill-4, #0f1830)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.45"/>
  <text x="570" y="152" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.92" font-size="18" font-weight="700" text-anchor="middle">Kafka</text>
  <text x="570" y="172" fill="var(--diagram-blue-3, #93c5fd)" fill-opacity="0.8" font-size="11" text-anchor="middle">KRaft brokers</text>

  <rect x="456" y="190" width="68" height="40" rx="9" fill="var(--diagram-blue-fill, #1e3a5f)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.4"/>
  <text x="490" y="215" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.8" font-size="11" text-anchor="middle">broker</text>
  <rect x="536" y="190" width="68" height="40" rx="9" fill="var(--diagram-blue-fill, #1e3a5f)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.4"/>
  <text x="570" y="215" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.8" font-size="11" text-anchor="middle">broker</text>
  <rect x="616" y="190" width="68" height="40" rx="9" fill="var(--diagram-blue-fill, #1e3a5f)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.4"/>
  <text x="650" y="215" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.8" font-size="11" text-anchor="middle">broker</text>

  <text x="570" y="262" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.6" font-size="12" text-anchor="middle">topics</text>
  <text x="570" y="282" fill="var(--diagram-blue-3, #93c5fd)" fill-opacity="0.65" font-size="10.5" text-anchor="middle">partitioned, replicated</text>

  <!-- arrows kafka -> sinks -->
  <line x1="708" y1="180" x2="950" y2="108" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="708" y1="205" x2="950" y2="186" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="708" y1="235" x2="950" y2="264" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="708" y1="260" x2="950" y2="342" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M950 108 l-11 -1 4 -9 z" fill="var(--diagram-green, #34d399)" fill-opacity="0.7"/>
  <path d="M950 186 l-11 -2 5 9 z" fill="var(--diagram-green, #34d399)" fill-opacity="0.7"/>
  <path d="M950 264 l-11 2 5 -9 z" fill="var(--diagram-green, #34d399)" fill-opacity="0.7"/>
  <path d="M950 342 l-11 2 4 9 z" fill="var(--diagram-green, #34d399)" fill-opacity="0.7"/>

  <!-- ===== SINK CONNECTORS (right) ===== -->
  <text x="950" y="48" fill="var(--diagram-green-2, #6ee7b7)" fill-opacity="0.9" font-size="15" font-weight="600">Sink connectors</text>
  <text x="950" y="70" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="12">Stream records out</text>

  <rect x="950" y="88" width="190" height="46" rx="12" fill="var(--diagram-green-fill-2, #06281e)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4"/>
  <text x="1045" y="116" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.88" font-size="13" text-anchor="middle">JDBC (SQL upsert)</text>

  <rect x="950" y="166" width="190" height="46" rx="12" fill="var(--diagram-green-fill-2, #06281e)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4"/>
  <text x="1045" y="194" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.88" font-size="13" text-anchor="middle">S3 (RustFS)</text>

  <rect x="950" y="244" width="190" height="46" rx="12" fill="var(--diagram-green-fill-2, #06281e)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4"/>
  <text x="1045" y="272" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.88" font-size="13" text-anchor="middle">MongoDB</text>

  <rect x="950" y="322" width="190" height="46" rx="12" fill="var(--diagram-green-fill-2, #06281e)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4"/>
  <text x="1045" y="350" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.88" font-size="13" text-anchor="middle">ClickHouse</text>

  <text x="600" y="416" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="13" text-anchor="middle">Source connectors stream data in, sink connectors stream data out. Connection details auto-fill from a paired add-on.</text>
</svg>
