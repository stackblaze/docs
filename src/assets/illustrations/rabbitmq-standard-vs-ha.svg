<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="400" fill="var(--diagram-canvas, #07070d)"/>
  <circle cx="260" cy="200" r="200" fill="var(--diagram-violet, #8b5cf6)" opacity="0.07"/>
  <circle cx="940" cy="200" r="220" fill="var(--diagram-blue, #3b82f6)" opacity="0.07"/>
  <line x1="600" y1="60" x2="600" y2="340" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.08" stroke-dasharray="4 6"/>

  <text x="60" y="50" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.55" font-size="20" font-weight="600">Standard</text>
  <text x="60" y="74" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="13">Single node · no queue replication</text>

  <rect x="90" y="150" width="130" height="60" rx="14" fill="var(--diagram-violet-fill-2, #1e1b3a)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.35"/>
  <text x="155" y="186" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.8" font-size="15" text-anchor="middle">Producer</text>

  <line x1="220" y1="180" x2="300" y2="180" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M300 180 l-10 -5 v10 z" fill="var(--diagram-violet-2, #a78bfa)" fill-opacity="0.7"/>

  <rect x="310" y="136" width="200" height="88" rx="14" fill="var(--diagram-violet-fill, #312e81)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.45"/>
  <text x="410" y="172" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.9" font-size="15" text-anchor="middle" font-weight="600">RabbitMQ</text>
  <text x="410" y="194" fill="var(--diagram-violet-3, #c4b5fd)" fill-opacity="0.8" font-size="12" text-anchor="middle">one node</text>
  <text x="410" y="212" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">AMQP :5672</text>

  <text x="290" y="356" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="13" text-anchor="middle">Node loss takes the broker offline until it restarts.</text>

  <text x="650" y="50" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.55" font-size="20" font-weight="600">High availability</text>
  <text x="650" y="74" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="13">Multi-node cluster · quorum queues</text>

  <rect x="650" y="150" width="120" height="60" rx="14" fill="var(--diagram-blue-fill-2, #15213a)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.35"/>
  <text x="710" y="186" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.8" font-size="15" text-anchor="middle">Producer</text>

  <line x1="770" y1="180" x2="828" y2="180" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M828 180 l-10 -5 v10 z" fill="var(--diagram-blue-2, #60a5fa)" fill-opacity="0.7"/>

  <rect x="830" y="150" width="110" height="60" rx="14" fill="var(--diagram-blue-fill-2, #15213a)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.4"/>
  <text x="885" y="176" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.85" font-size="13" text-anchor="middle" font-weight="600">Cluster</text>
  <text x="885" y="194" fill="var(--diagram-blue-3, #93c5fd)" fill-opacity="0.8" font-size="11" text-anchor="middle">AMQP</text>

  <rect x="1000" y="96" width="150" height="56" rx="13" fill="var(--diagram-blue-fill, #1e3a5f)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.5"/>
  <text x="1075" y="120" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.9" font-size="14" text-anchor="middle" font-weight="600">Node 1</text>
  <text x="1075" y="138" fill="var(--diagram-blue-3, #93c5fd)" fill-opacity="0.8" font-size="11" text-anchor="middle">quorum member</text>

  <rect x="1000" y="172" width="150" height="56" rx="13" fill="var(--diagram-blue-fill-2, #15213a)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.35"/>
  <text x="1075" y="196" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.85" font-size="14" text-anchor="middle">Node 2</text>
  <text x="1075" y="214" fill="var(--diagram-blue-3, #93c5fd)" fill-opacity="0.7" font-size="11" text-anchor="middle">quorum member</text>

  <rect x="1000" y="248" width="150" height="56" rx="13" fill="var(--diagram-blue-fill-2, #15213a)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.35"/>
  <text x="1075" y="272" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.85" font-size="14" text-anchor="middle">Node 3</text>
  <text x="1075" y="290" fill="var(--diagram-blue-3, #93c5fd)" fill-opacity="0.7" font-size="11" text-anchor="middle">quorum member</text>

  <line x1="940" y1="172" x2="1000" y2="124" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="940" y1="186" x2="1000" y2="200" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="940" y1="196" x2="1000" y2="276" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.3" stroke-width="2"/>

  <line x1="1075" y1="152" x2="1075" y2="172" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="1075" y1="228" x2="1075" y2="248" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="1163" y="204" fill="var(--diagram-green, #34d399)" fill-opacity="0.7" font-size="11" text-anchor="middle" transform="rotate(90 1163 204)">quorum queues</text>

  <text x="895" y="356" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="13" text-anchor="middle">Messages survive a node loss · cluster keeps serving.</text>
</svg>
