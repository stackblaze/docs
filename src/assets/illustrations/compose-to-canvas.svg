<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="400" fill="var(--diagram-canvas, #07070d)"/>
  <circle cx="220" cy="120" r="160" fill="var(--diagram-violet, #8b5cf6)" opacity="0.08"/>
  <circle cx="980" cy="280" r="180" fill="var(--diagram-blue, #3b82f6)" opacity="0.07"/>

  <text x="70" y="48" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.55" font-size="20" font-weight="600">Compose to canvas</text>
  <text x="70" y="72" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="13">App containers become services · datastores become managed databases</text>

  <text x="70" y="108" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="13">docker-compose.yml</text>

  <rect x="70" y="122" width="200" height="64" rx="12" fill="var(--diagram-violet-fill, #312e81)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.4"/>
  <text x="170" y="148" fill="var(--diagram-violet-4, #e9d5ff)" font-size="14" font-weight="600" text-anchor="middle">web</text>
  <text x="170" y="168" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">build: . · :3000</text>

  <rect x="70" y="198" width="200" height="64" rx="12" fill="var(--diagram-violet-fill-2, #1e1b3a)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.3"/>
  <text x="170" y="224" fill="var(--diagram-violet-3, #c4b5fd)" font-size="14" font-weight="600" text-anchor="middle">postgres</text>
  <text x="170" y="244" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">image: postgres:16</text>

  <rect x="70" y="274" width="200" height="64" rx="12" fill="var(--diagram-violet-fill-2, #1e1b3a)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.3"/>
  <text x="170" y="300" fill="var(--diagram-violet-3, #c4b5fd)" font-size="14" font-weight="600" text-anchor="middle">redis</text>
  <text x="170" y="320" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">image: redis:7</text>

  <path d="M290 220 H400" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.2" stroke-width="2"/>
  <polygon points="400,220 388,214 388,226" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3"/>

  <rect x="410" y="178" width="180" height="84" rx="14" fill="var(--diagram-blue-fill-3, #101827)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.4"/>
  <text x="500" y="214" fill="var(--diagram-blue-3, #93c5fd)" font-size="15" font-weight="600" text-anchor="middle">Import</text>
  <text x="500" y="236" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-size="12" text-anchor="middle">+ Service · stages tiles</text>

  <path d="M590 220 H700" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="700,220 688,214 688,226" fill="var(--diagram-green, #34d399)" fill-opacity="0.7"/>

  <text x="720" y="108" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-size="13">Project canvas</text>

  <rect x="720" y="122" width="220" height="64" rx="12" fill="var(--diagram-blue-fill, #1e3a5f)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.45"/>
  <text x="830" y="148" fill="var(--diagram-blue-3, #93c5fd)" font-size="14" font-weight="600" text-anchor="middle">web service</text>
  <text x="830" y="168" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">from Dockerfile · port 3000</text>

  <rect x="720" y="198" width="220" height="64" rx="12" fill="var(--diagram-green-fill, #064e3b)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4"/>
  <text x="830" y="224" fill="var(--diagram-green-2, #6ee7b7)" font-size="14" font-weight="600" text-anchor="middle">Managed PostgreSQL</text>
  <text x="830" y="244" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">not a DIY container</text>

  <rect x="720" y="274" width="220" height="64" rx="12" fill="var(--diagram-green-fill-2, #06281e)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.35"/>
  <text x="830" y="300" fill="var(--diagram-green-2, #6ee7b7)" font-size="14" font-weight="600" text-anchor="middle">Managed Redis</text>
  <text x="830" y="320" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">not a DIY container</text>

  <rect x="970" y="198" width="160" height="64" rx="12" fill="var(--diagram-neutral-fill, #1c1917)" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.08"/>
  <text x="1050" y="224" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.5" font-size="12" text-anchor="middle">Private network</text>
  <text x="1050" y="244" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="11" text-anchor="middle">names still resolve</text>

  <text x="70" y="372" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="13">import stages the tiles · deploy applies them · drop hardcoded DATABASE_URL</text>
</svg>
