<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <rect width="1200" height="400" fill="var(--diagram-canvas, #07070d)"/>
  <text x="80" y="55" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Service types in one project</text>
  <rect x="80" y="100" width="200" height="90" rx="14" fill="var(--diagram-violet-fill, #312e81)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.35"/>
  <text x="110" y="140" fill="var(--diagram-violet-4, #e9d5ff)" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="600">Web</text>
  <text x="110" y="168" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="13">public HTTPS</text>
  <rect x="300" y="100" width="200" height="90" rx="14" fill="var(--diagram-violet-fill-2, #1e1b4b)" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.08"/>
  <text x="330" y="140" fill="var(--diagram-blue-3, #93c5fd)" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="600">Worker</text>
  <text x="330" y="168" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="13">no ingress</text>
  <rect x="520" y="100" width="200" height="90" rx="14" fill="var(--diagram-violet-fill-2, #1e1b4b)" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.08"/>
  <text x="550" y="140" fill="var(--diagram-amber, #fde68a)" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="600">Cron</text>
  <text x="550" y="168" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="13">scheduled</text>
  <rect x="740" y="100" width="200" height="90" rx="14" fill="var(--diagram-green-fill, #064e3b)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.35"/>
  <text x="770" y="140" fill="var(--diagram-green-2, #6ee7b7)" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="600">Postgres</text>
  <text x="770" y="168" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="13">add-on</text>
  <rect x="960" y="100" width="160" height="90" rx="14" fill="var(--diagram-violet-fill-2, #1e1b4b)" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.08"/>
  <text x="990" y="140" fill="var(--diagram-red, #fca5a5)" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="600">Redis</text>
  <text x="990" y="168" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="13">add-on</text>
  <path d="M180 190 L180 250 L600 250 L600 190" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <path d="M400 190 L400 270 L600 270" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <text x="80" y="320" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="14">private network | shared blueprint.yaml | one bill per project</text>
