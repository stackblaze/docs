<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <rect width="1200" height="400" fill="var(--diagram-canvas, #07070d)"/>
  <text x="80" y="55" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Point-in-time recovery</text>
  <rect x="80" y="120" width="200" height="80" rx="12" fill="var(--diagram-green-fill, #064e3b)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4"/>
  <text x="110" y="158" fill="var(--diagram-green-2, #6ee7b7)" font-family="ui-monospace, monospace" font-size="15">Base backup</text>
  <text x="110" y="182" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="12">daily snapshot</text>
  <rect x="300" y="120" width="720" height="80" rx="12" fill="var(--diagram-blue-fill, #1e3a5f)" stroke="var(--diagram-cyan, #38bdf8)" stroke-opacity="0.35"/>
  <text x="330" y="158" fill="var(--diagram-cyan-2, #7dd3fc)" font-family="ui-monospace, monospace" font-size="15">WAL segments to object storage</text>
  <text x="330" y="182" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="12">archive every 60s | encrypted</text>
  <line x1="520" y1="100" x2="520" y2="240" stroke="var(--diagram-pink, #f472b6)" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="500" y="95" fill="var(--diagram-pink-2, #fda4af)" font-family="ui-monospace, monospace" font-size="12">restore here</text>
  <text x="80" y="280" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="14">Replay WAL up to target timestamp - RPO ~60 seconds on StackBlaze</text>
</svg>
