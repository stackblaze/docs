<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="400" fill="var(--diagram-canvas, #07070d)"/>
  <circle cx="180" cy="90" r="150" fill="var(--diagram-violet, #8b5cf6)" opacity="0.1"/>
  <circle cx="1040" cy="300" r="170" fill="var(--diagram-blue, #3b82f6)" opacity="0.08"/>

  <text x="70" y="48" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.55" font-size="20" font-weight="600">Variables from a database</text>
  <text x="70" y="72" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="13">fromDatabase injects the live connection string</text>

  <rect x="70" y="130" width="220" height="100" rx="16" fill="var(--diagram-green-fill, #064e3b)" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.4"/>
  <text x="180" y="172" fill="var(--diagram-green-2, #6ee7b7)" font-size="16" font-weight="600" text-anchor="middle">postgres</text>
  <text x="180" y="196" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-size="12" text-anchor="middle">canvas database tile</text>
  <text x="180" y="214" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">connectionString</text>

  <path d="M290 180 H360" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.2" stroke-width="2"/>
  <polygon points="360,180 348,174 348,186" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3"/>

  <rect x="370" y="118" width="300" height="124" rx="16" fill="var(--diagram-blue-fill-3, #101827)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.4"/>
  <text x="520" y="154" fill="var(--diagram-blue-3, #93c5fd)" font-family="ui-monospace, monospace" font-size="15" font-weight="600" text-anchor="middle">fromDatabase</text>
  <text x="520" y="180" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.45" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">name: postgres</text>
  <text x="520" y="202" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.45" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">property: connectionString</text>
  <text x="520" y="224" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">in stackblaze.yaml</text>

  <path d="M670 180 H740" stroke="var(--diagram-green, #34d399)" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="740,180 728,174 728,186" fill="var(--diagram-green, #34d399)" fill-opacity="0.7"/>

  <rect x="750" y="130" width="220" height="100" rx="16" fill="var(--diagram-violet-fill, #312e81)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.4"/>
  <text x="860" y="172" fill="var(--diagram-violet-4, #e9d5ff)" font-size="16" font-weight="600" text-anchor="middle">api service</text>
  <text x="860" y="196" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.45" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">DATABASE_URL</text>
  <text x="860" y="214" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="12" text-anchor="middle">injected at build and runtime</text>

  <rect x="70" y="268" width="430" height="64" rx="14" fill="var(--diagram-violet-fill-2, #1e1b3a)" stroke="var(--diagram-violet-2, #a78bfa)" stroke-opacity="0.3"/>
  <text x="285" y="294" fill="var(--diagram-violet-3, #c4b5fd)" font-size="14" font-weight="600" text-anchor="middle">Production</text>
  <text x="285" y="316" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-size="12" text-anchor="middle">own connection string for this environment</text>

  <rect x="530" y="268" width="440" height="64" rx="14" fill="var(--diagram-blue-fill-2, #15213a)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.3"/>
  <text x="750" y="294" fill="var(--diagram-blue-3, #93c5fd)" font-size="14" font-weight="600" text-anchor="middle">Preview</text>
  <text x="750" y="316" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-size="12" text-anchor="middle">own string · not copied from production</text>

  <text x="70" y="372" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="13">prefer fromDatabase over pasting a URL · values are scoped per environment</text>
</svg>
