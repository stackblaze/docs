<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="400" fill="var(--diagram-canvas, #07070d)"/>
  <circle cx="240" cy="200" r="180" fill="var(--diagram-blue, #3b82f6)" opacity="0.07"/>
  <circle cx="960" cy="200" r="200" fill="var(--diagram-pink, #f472b6)" opacity="0.06"/>
  <line x1="600" y1="56" x2="600" y2="340" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.08" stroke-dasharray="4 6"/>

  <text x="60" y="48" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.55" font-size="20" font-weight="600">CPU limit</text>
  <text x="60" y="72" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="13">Usage above the cap is throttled</text>

  <rect x="80" y="110" width="440" height="200" rx="16" fill="var(--diagram-blue-fill-3, #101827)" stroke="var(--diagram-blue-2, #60a5fa)" stroke-opacity="0.35"/>
  <rect x="120" y="150" width="28" height="110" rx="6" fill="var(--diagram-blue-fill, #1e3a5f)"/>
  <rect x="164" y="130" width="28" height="130" rx="6" fill="var(--diagram-blue-fill, #1e3a5f)"/>
  <rect x="208" y="168" width="28" height="92" rx="6" fill="var(--diagram-blue-2, #60a5fa)" fill-opacity="0.55"/>
  <rect x="252" y="118" width="28" height="142" rx="6" fill="var(--diagram-amber-2, #fbbf24)" fill-opacity="0.7"/>
  <rect x="296" y="140" width="28" height="120" rx="6" fill="var(--diagram-amber-2, #fbbf24)" fill-opacity="0.7"/>
  <rect x="340" y="160" width="28" height="100" rx="6" fill="var(--diagram-blue-fill, #1e3a5f)"/>
  <line x1="110" y1="168" x2="480" y2="168" stroke="var(--diagram-amber-2, #fbbf24)" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="488" y="172" fill="var(--diagram-amber, #fde68a)" font-size="11">limit</text>
  <text x="300" y="284" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.4" font-size="12" text-anchor="middle">bars above the line are throttled, not killed</text>

  <text x="300" y="348" fill="var(--diagram-blue-3, #93c5fd)" fill-opacity="0.85" font-size="14" text-anchor="middle">Process keeps running</text>
  <text x="300" y="370" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="13" text-anchor="middle">Latency rises · work slows · no crash</text>

  <text x="650" y="48" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.55" font-size="20" font-weight="600">Memory limit</text>
  <text x="650" y="72" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.3" font-size="13">Crossing the cap OOM-kills the process</text>

  <rect x="670" y="110" width="460" height="200" rx="16" fill="var(--diagram-pink-fill, #1f1317)" stroke="var(--diagram-red, #fca5a5)" stroke-opacity="0.3"/>
  <rect x="710" y="230" width="360" height="36" rx="8" fill="var(--diagram-violet-fill-2, #1e1b3a)"/>
  <rect x="710" y="178" width="360" height="52" rx="8" fill="var(--diagram-red, #fca5a5)" fill-opacity="0.35"/>
  <line x1="700" y1="178" x2="1080" y2="178" stroke="var(--diagram-red, #fca5a5)" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1088" y="182" fill="var(--diagram-red, #fca5a5)" font-size="11">limit</text>
  <text x="890" y="210" fill="var(--diagram-red, #fca5a5)" font-size="13" font-weight="600" text-anchor="middle">RSS crosses the line</text>
  <text x="890" y="254" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.45" font-size="12" text-anchor="middle">no throttle · hard kill</text>
  <text x="890" y="284" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="12" text-anchor="middle">instance restarts</text>

  <text x="900" y="348" fill="var(--diagram-red, #fca5a5)" fill-opacity="0.9" font-size="14" text-anchor="middle">OOM-kill, then restart</text>
  <text x="900" y="370" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-size="13" text-anchor="middle">Raise the limit or shrink caches</text>
</svg>
