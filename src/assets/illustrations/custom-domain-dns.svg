  <text x="790" y="178" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="12">auto TLS</text>
  <text x="80" y="260" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="13">DNS verification in dashboard - certificate renews automatically</text>
