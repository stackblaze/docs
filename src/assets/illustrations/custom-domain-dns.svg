  <path d="M290 155 H400" stroke="var(--diagram-ink, #ffffff)" stroke-opacity="0.2" stroke-width="2"/>
  <text x="310" y="140" fill="var(--diagram-ink, #ffffff)" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="11">CNAME</text>
